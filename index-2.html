<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>اسکن زمین</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Tahoma,sans-serif; background:#0e1512; color:#eaf3ee; }
  #map { height: 52vh; width: 100%; }
  button.small.on { background:#e64040; }
  .markRow { display:flex; gap:8px; align-items:center; padding:4px 12px; font-size:13px; direction:ltr; }
  .markRow span { flex:1; }
  .markRow a { color:#5dcaa5; font-size:12px; }
  .markRow button { padding:6px 10px; font-size:12px; }
  .hillshadeLayer { mix-blend-mode: multiply; }
  .panel { padding: 14px 16px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  label { font-size:13px; color:#9fcbb5; min-width:66px; }
  input[type=text], input[type=number] { flex:1; padding:10px; border-radius:8px; border:1px solid #23443a; background:#132621; color:#eaf3ee; font-size:14px; min-width:0; }
  input[type=range] { flex:1; }
  button { padding:14px; border:none; border-radius:10px; background:#1d9e75; color:#fff; font-size:16px; font-weight:bold; }
  button.full { width:100%; }
  button.small { padding:10px 14px; font-size:14px; background:#23443a; }
  button:disabled { background:#3a5c50; }
  #status { font-size:13px; color:#9fcbb5; margin-top:8px; min-height:18px; white-space:pre-line; }
  .maps { display:flex; flex-direction:column; gap:4px; padding:0 16px 24px; }
  .mapCard { border:1px solid #23443a; border-radius:12px; overflow:hidden; margin-bottom:14px; background:#0b100e; }
  .mapCard canvas { width:100%; display:block; }
  .cap { font-size:14px; font-weight:bold; padding:10px 12px 4px; }
  .sub { font-size:12px; color:#9fcbb5; padding:0 12px 10px; }
  .legend { display:flex; align-items:center; gap:8px; padding:0 12px 12px; font-size:11px; color:#cfe9dc; }
  .legend .bar { flex:1; height:10px; border-radius:5px; }
  .apikeyRow { display:flex; }
  a { color:#5dcaa5; }
  .searchRow { display:flex; gap:6px; padding:10px 16px 0; }
  .searchRow input { flex:1; }
  .footer { padding:10px 16px 28px; font-size:11px; color:#6f9483; border-top:1px solid #1c2f28; margin-top:6px; line-height:1.8; }
  .suggestions { margin:0 16px; background:#132621; border:1px solid #23443a; border-radius:8px; overflow:hidden; }
  .suggestions div { padding:10px; font-size:13px; border-bottom:1px solid #1c2f28; }
  .suggestions div:last-child { border-bottom:none; }
  .langRow { display:flex; gap:6px; padding:10px 16px 0; flex-wrap:wrap; }
  .langBtn { padding:7px 12px; font-size:12px; font-weight:normal; border-radius:20px; background:#132621; border:1px solid #23443a; color:#9fcbb5; width:auto; }
  .langBtn.active { background:#1d9e75; color:#fff; border-color:#1d9e75; }
  select { flex:1; padding:10px; border-radius:8px; border:1px solid #23443a; background:#132621; color:#eaf3ee; font-size:14px; min-width:0; }
  .ctrls { padding:10px 12px 0; }
  .cmpWrap { position:relative; direction:ltr; }
  .cmpMap { height:min(62vh,420px); width:100%; background:#0b100e; touch-action:none; }
  .cmpDivider { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:#fff; z-index:1001; pointer-events:none; box-shadow:0 0 0 1px rgba(0,0,0,.35); }
  .cmpRange { position:absolute; left:0; top:50%; width:100%; height:44px; margin:-22px 0 0; z-index:1002; pointer-events:none; -webkit-appearance:none; appearance:none; background:transparent; }
  .cmpRange::-webkit-slider-runnable-track { background:transparent; height:44px; }
  .cmpRange::-moz-range-track { background:transparent; height:44px; }
  .cmpRange::-webkit-slider-thumb { -webkit-appearance:none; pointer-events:auto; width:44px; height:44px; border-radius:50%; background:#1d9e75; border:3px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.5); }
  .cmpRange::-moz-range-thumb { pointer-events:auto; width:38px; height:38px; border-radius:50%; background:#1d9e75; border:3px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.5); }
  .cmpTag { position:absolute; bottom:8px; z-index:1001; padding:3px 9px; font-size:11px; border-radius:10px; background:rgba(11,16,14,.78); color:#eaf3ee; pointer-events:none; }
  .cmpTag.l { left:8px; } .cmpTag.r { right:8px; }
  .hero { padding:14px 16px 4px; }
  .hero h1 { font-size:17px; margin:0 0 8px; color:#eaf3ee; }
  .hero svg { width:100%; height:auto; display:block; background:#0b100e; border-radius:12px; border:1px solid #23443a; }
</style>
</head>
<body>

<div class="langRow" id="langRow">
  <button class="langBtn active" data-lang="fa">فارسی</button>
  <button class="langBtn" data-lang="en">English</button>
  <button class="langBtn" data-lang="tr">Türkçe</button>
  <button class="langBtn" data-lang="ar">العربية</button>
</div>

    <text x="253" y="232" font-size="9" fill="#eaf3ee" data-i18n="heroAnomaly2">(حفره/فلز)</text>
  </svg>
</div>

<div class="searchRow">
  <input type="text" id="placeSearch" data-i18n-ph="searchPh" placeholder="اسم منطقه یا شهر رو تایپ کنید...">
  <button class="small" id="searchBtn" data-i18n="searchBtn">جستجو</button>
</div>
<div class="suggestions" id="suggestions" style="display:none"></div>

<div id="map"></div>

<div class="panel">
  <div class="row apikeyRow" id="apikeyRow">
    <label data-i18n="apikeyLabel">کلید API</label>
    <input type="text" id="apikey" data-i18n-ph="apikeyPh" placeholder="کلید رایگان OpenTopography" onfocus="this.select()">
    <button type="button" class="small" id="clearKeyBtn" data-i18n="clearBtn">پاک کردن</button>
  </div>
  <div class="row">
    <label>DEM</label>
    <select id="demType"><option value="COP30">Copernicus 30m</option><option value="AW3D30">ALOS AW3D30</option><option value="NASADEM">NASADEM</option></select>
  </div>
  <div class="row">
    <label data-i18n="radiusLabel">شعاع (کیلومتر)</label>
    <input type="range" id="radius" min="0.5" max="20" step="0.5" value="5">
    <span id="radiusVal">5</span>
  </div>
  <div class="row">
    <label data-i18n="latLabel">عرض جغرافیایی</label>
    <input type="text" inputmode="decimal" id="latInput" placeholder="36.5652">
  </div>
  <div class="row">
    <label data-i18n="lonLabel">طول جغرافیایی</label>
    <input type="text" inputmode="decimal" id="lonInput" placeholder="53.0584">
  </div>
  <button class="full" id="scanBtn" data-i18n="scanBtn">اسکن کن</button>
  <div id="status"></div>
  <div class="cap" style="font-size:12px;font-weight:normal;color:#9fcbb5;padding-top:10px">
    <span data-i18n="apikeyLinkLabel">کلید رایگان:</span> <a href="https://portal.opentopography.org/myopentopo" target="_blank">portal.opentopography.org/myopentopo</a>
  </div>
</div>

<div class="maps" id="results"></div>

function toEnglishDigits(str) {
  const fa = '۰۱۲۳۴۵۶۷۸۹', ar = '٠١٢٣٤٥٦٧٨٩';
  return str.replace(/[۰-۹٠-٩]/g, ch => {
    const i = fa.indexOf(ch); if (i > -1) return i;
    const j = ar.indexOf(ch); if (j > -1) return j;
    return ch;
  }).replace(/[،٫]/g, '.');
}
function normalizeInput(el) {
  el.addEventListener('input', () => {
    const cleaned = toEnglishDigits(el.value);
    if (cleaned !== el.value) {
      const pos = el.selectionStart;
      el.value = cleaned;
      try { el.setSelectionRange(pos, pos); } catch (e) {}
    }
  });
}

function bboxFromCenter(lat, lon, radiusKm) {
  const dlat = radiusKm / 111.0;
  const dlon = radiusKm / (111.0 * Math.cos(lat * Math.PI / 180));
  return { south: lat - dlat, north: lat + dlat, west: lon - dlon, east: lon + dlon };
}

// OpenTopography's API does not send CORS headers, so a direct browser fetch
// is blocked by the browser before this code ever sees a response (it just
// throws "Failed to fetch"). No server/deploy step needed: we just try the
// direct call first, then walk through a list of free public CORS proxies
// until one of them works. Everything stays in this single HTML file.
function buildProxyUrls(directUrl) {
  const enc = encodeURIComponent(directUrl);
  return [
    { label: 'مستقیم (بدون پروکسی)', url: directUrl },
    { label: 'پروکسی codetabs', url: 'https://api.codetabs.com/v1/proxy?quest=' + enc },
    { label: 'پروکسی corsproxy.io', url: 'https://corsproxy.io/?url=' + enc },
    { label: 'پروکسی allorigins', url: 'https://api.allorigins.win/raw?url=' + enc }
  ];
}

async function fetchBuffer(directUrl, onAttempt) {
  async function attempt(url) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 45000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error('HTTP ' + res.status + ': ' + txt.slice(0, 200));
      }
      const buf = await res.arrayBuffer();
      if (buf.byteLength < 50) throw new Error('پاسخ خالی برگشت (' + buf.byteLength + ' بایت)');
      // A proxy that is down/blocked often still returns HTTP 200 with an
      // HTML error page instead of the actual GeoTIFF bytes. Detect that.
      const head = new TextDecoder('utf-8', { fatal: false }).decode(buf.slice(0, 20)).trim();
      if (head.startsWith('<') || head.startsWith('{')) {
        throw new Error('پاسخ معتبر GeoTIFF نبود، این متن برگشت: ' + new TextDecoder('utf-8', { fatal: false }).decode(buf.slice(0, 150)));
      }
      return buf;
    } finally {
      clearTimeout(timer);
    }
  }

  const errors = [];
  for (const { label, url } of buildProxyUrls(directUrl)) {
    if (onAttempt) onAttempt(label);
    try {
      return await attempt(url);
    } catch (err) {
      errors.push(label + ': ' + (err && err.message ? err.message : String(err)));
    }
  }
  throw new Error(errors.join('\n'));
}

async function fetchDem(bbox, apiKey, onAttempt, demtype) {
  const params = new URLSearchParams({
    demtype: demtype || 'COP30',
    south: bbox.south,
    north: bbox.north,
    west: bbox.west,
    east: bbox.east,
    outputFormat: 'GTiff',
    API_Key: apiKey
  });
  const directUrl = 'https://portal.opentopography.org/API/globaldem?' + params.toString();
  return fetchBuffer(directUrl, onAttempt);
}

// High-resolution bare-earth elevation (lidar-derived, down to 1 m where it
// exists) from the free USGS 3DEP service. Covers the USA only, no API key.
const HI_MAX_PX = 1500;
function inUSCoverage(lat, lon) {
  return (lat >= 24 && lat <= 49.6 && lon >= -125 && lon <= -66.5) ||
         (lat >= 51 && lat <= 71.5 && lon >= -170 && lon <= -129.5) ||
         (lat >= 18.5 && lat <= 22.5 && lon >= -160.6 && lon <= -154.5);
}
async function fetchHiRes(bbox, onAttempt) {
  const midLat = (bbox.north + bbox.south) / 2;
  const wM = (bbox.east - bbox.west) * 111320 * Math.cos(midLat * Math.PI / 180);
  const hM = (bbox.north - bbox.south) * 110540;
  const scale = Math.min(1, HI_MAX_PX / Math.max(wM, hM));
  const pw = Math.max(64, Math.round(wM * scale));
  const ph = Math.max(64, Math.round(hM * scale));
  const params = new URLSearchParams({
    bbox: [bbox.west, bbox.south, bbox.east, bbox.north].join(','),
    bboxSR: '4326', imageSR: '4326', size: pw + ',' + ph,
    format: 'tiff', pixelType: 'F32', noDataInterpretation: 'esriNoDataMatchAny',
    interpolation: 'RSP_BilinearInterpolation', f: 'image'
  });
  const directUrl = 'https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer/exportImage?' + params.toString();
  return fetchBuffer(directUrl, onAttempt);
}

async function loadDem(buffer) {
  const tiff = await GeoTIFF.fromArrayBuffer(buffer);
  const image = await tiff.getImage();
  const width = image.getWidth();
  const height = image.getHeight();
  const rasters = await image.readRasters();
  const data = rasters[0];
  const arr = new Float64Array(width * height);
  let validCount = 0;
  for (let i = 0; i < arr.length; i++) {
    let v = data[i];
    if (v < -1000 || v > 9000) v = NaN; else validCount++;
    arr[i] = v;
  }
  if (width === 0 || height === 0 || validCount === 0) {
    throw new Error('__NO_DATA__');
  }
  let bbox = null;
  try {
    const b = image.getBoundingBox();
    if (b && b.length === 4 && b.every(Number.isFinite) && b[2] > b[0] && b[3] > b[1] &&
        Math.abs(b[0]) <= 180 && Math.abs(b[2]) <= 180 && Math.abs(b[1]) <= 90 && Math.abs(b[3]) <= 90) {
      bbox = { west: b[0], south: b[1], east: b[2], north: b[3] };
    }
  } catch (e) {}
  return { arr, width, height, bbox, validFrac: validCount / arr.length };
}

function boxBlur(arr, w, h, radius) {
  const mean = arr.reduce((a, b) => a + (isNaN(b) ? 0 : b), 0) / arr.length;
  const src = Float64Array.from(arr, v => isNaN(v) ? mean : v);
  const tmp = new Float64Array(w * h);
  const out = new Float64Array(w * h);
  for (let y = 0; y < h; y++) {
    const o = y * w;
    let sum = 0, cnt = 0;
    for (let x = 0; x <= Math.min(radius, w - 1); x++) { sum += src[o + x]; cnt++; }
    for (let x = 0; x < w; x++) {
      tmp[o + x] = sum / cnt;
      const add = x + radius + 1, rem = x - radius;
      if (add < w) { sum += src[o + add]; cnt++; }
      if (rem >= 0) { sum -= src[o + rem]; cnt--; }
    }
  }
  for (let x = 0; x < w; x++) {
    let sum = 0, cnt = 0;
    for (let y = 0; y <= Math.min(radius, h - 1); y++) { sum += tmp[y * w + x]; cnt++; }
    for (let y = 0; y < h; y++) {
      out[y * w + x] = sum / cnt;
      const add = y + radius + 1, rem = y - radius;
      if (add < h) { sum += tmp[add * w + x]; cnt++; }
      if (rem >= 0) { sum -= tmp[rem * w + x]; cnt--; }
    }
  }
  return out;
}

function localReliefModel(arr, w, h) {
  const sigma = Math.max(3, Math.round(Math.min(w, h) / 25));
  const smooth = boxBlur(arr, w, h, sigma);
  const lrm = new Float64Array(w * h);
  const mean = arr.reduce((a, b) => a + (isNaN(b) ? 0 : b), 0) / arr.length;
  for (let i = 0; i < arr.length; i++) {
    const v = isNaN(arr[i]) ? mean : arr[i];
    lrm[i] = v - smooth[i];
  }
  return lrm;
}

function hillshadeArr(arr, w, h, cellSizeM) {
  const out = new Float64Array(w * h);
  const az = 315 * Math.PI / 180, alt = 45 * Math.PI / 180;
  const mean = arr.reduce((a, b) => a + (isNaN(b) ? 0 : b), 0) / arr.length;
  const g = v => isNaN(v) ? mean : v;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - 1), x1 = Math.min(w - 1, x + 1);
      const y0 = Math.max(0, y - 1), y1 = Math.min(h - 1, y + 1);
      const dzdx = (g(arr[y * w + x1]) - g(arr[y * w + x0])) / (2 * cellSizeM);
      const dzdy = (g(arr[y1 * w + x]) - g(arr[y0 * w + x])) / (2 * cellSizeM);
      const slope = Math.atan(Math.sqrt(dzdx * dzdx + dzdy * dzdy));
      let aspect = Math.atan2(dzdy, -dzdx);
      let sh = Math.cos(alt) * Math.cos(slope) + Math.sin(alt) * Math.sin(slope) * Math.cos(az - aspect);
      sh = Math.max(0, Math.min(1, sh));
      out[y * w + x] = sh;
    }
  }
  return out;
}

function elevationColor(t) {
  const stops = [
    [0.00, [46, 110, 64]],
    [0.30, [120, 168, 70]],
    [0.55, [214, 196, 100]],
    [0.78, [176, 128, 82]],
    [1.00, [250, 248, 244]]
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    if (t >= t0 && t <= t1) {
      const f = (t - t0) / (t1 - t0 || 1);
      return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
    }
  }
  return stops[stops.length - 1][1];
}

// ---- lidar-style relief view: multi-directional hillshade + colour ramp ----
const RELIEF_RAMP = [
  [0.00, [38, 98, 140]], [0.22, [52, 150, 96]], [0.45, [150, 190, 70]],
  [0.65, [232, 214, 70]], [0.82, [236, 150, 46]], [1.00, [176, 52, 36]]
];
const RELIEF_LUT = (() => {
  const lut = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    let c = RELIEF_RAMP[RELIEF_RAMP.length - 1][1];
    for (let k = 0; k < RELIEF_RAMP.length - 1; k++) {
      const [t0, c0] = RELIEF_RAMP[k], [t1, c1] = RELIEF_RAMP[k + 1];
      if (t >= t0 && t <= t1) {
        const f = (t - t0) / (t1 - t0);
        c = [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
        break;
      }
    }
    lut[i * 3] = c[0]; lut[i * 3 + 1] = c[1]; lut[i * 3 + 2] = c[2];
  }
  return lut;
})();

function percentileRange(arr, p1, p2) {
  const step = Math.max(1, Math.floor(arr.length / 60000));
  const s = [];
  for (let i = 0; i < arr.length; i += step) if (!isNaN(arr[i])) s.push(arr[i]);
  if (!s.length) return [0, 1];
  s.sort((a, b) => a - b);
  const lo = s[Math.floor(s.length * p1)], hi = s[Math.min(s.length - 1, Math.floor(s.length * p2))];
  return [lo, hi > lo ? hi : lo + 1];
}

// Average of 4 light directions (SW..N) so no feature hides parallel to the light.
function multiHillshade(arr, w, h, cellX, cellY, exag) {
  let sum = 0, n = 0;
  for (let i = 0; i < arr.length; i += 97) if (!isNaN(arr[i])) { sum += arr[i]; n++; }
  const fill = n ? sum / n : 0;
  const z = Float32Array.from(arr, v => isNaN(v) ? fill : v);
  const out = new Float32Array(w * h);
  const alt = 40 * Math.PI / 180, cosA = Math.cos(alt), sinA = Math.sin(alt);
  const LX = [], LY = [];
  for (const deg of [225, 270, 315, 360]) {
    const a = deg * Math.PI / 180;
    LX.push(Math.sin(a) * cosA); LY.push(Math.cos(a) * cosA);
  }
  for (let y = 0; y < h; y++) {
    const y0 = y > 0 ? y - 1 : 0, y1 = y < h - 1 ? y + 1 : h - 1;
    for (let x = 0; x < w; x++) {
      const x0 = x > 0 ? x - 1 : 0, x1 = x < w - 1 ? x + 1 : w - 1;
      const dzdE = exag * (z[y * w + x1] - z[y * w + x0]) / ((x1 - x0 || 1) * cellX);
      const dzdN = exag * (z[y0 * w + x] - z[y1 * w + x]) / ((y1 - y0 || 1) * cellY);
      const inv = 1 / Math.sqrt(1 + dzdE * dzdE + dzdN * dzdN);
      let s = 0;
      for (let k = 0; k < 4; k++) s += Math.max(0, (-dzdE * LX[k] - dzdN * LY[k] + sinA) * inv);
      out[y * w + x] = s / 4;
    }
  }
  return out;
}

// Catmull-Rom bicubic upsampling: smooth surface (no blocky/blurry pixels) so the
// hillshade is crisp. It does NOT add real detail, it only interpolates.
function upsampleBicubic(arr, w, h, f) {
  const W = Math.round(w * f), H = Math.round(h * f);
  let sum = 0, n = 0;
  for (let i = 0; i < arr.length; i += 53) if (!isNaN(arr[i])) { sum += arr[i]; n++; }
  const fill = n ? sum / n : 0;
  const src = Float32Array.from(arr, v => isNaN(v) ? fill : v);
  const wt = t => [ -0.5*t*t*t + t*t - 0.5*t, 1.5*t*t*t - 2.5*t*t + 1, -1.5*t*t*t + 2*t*t + 0.5*t, 0.5*t*t*t - 0.5*t*t ];
  const xi = new Int32Array(W * 4), xw = new Float32Array(W * 4), xn = new Int32Array(W);
  for (let X = 0; X < W; X++) {
    const sx = (X + 0.5) / f - 0.5, x0 = Math.floor(sx), k = wt(sx - x0);
    for (let j = 0; j < 4; j++) { xi[X*4+j] = Math.min(w - 1, Math.max(0, x0 - 1 + j)); xw[X*4+j] = k[j]; }
    xn[X] = Math.min(w - 1, Math.max(0, Math.round(sx)));
  }
  const out = new Float32Array(W * H);
  for (let Y = 0; Y < H; Y++) {
    const sy = (Y + 0.5) / f - 0.5, y0 = Math.floor(sy), ky = wt(sy - y0);
    const yi = [0,1,2,3].map(j => Math.min(h - 1, Math.max(0, y0 - 1 + j)) * w);
    const yn = Math.min(h - 1, Math.max(0, Math.round(sy))) * w;
    for (let X = 0; X < W; X++) {
      if (isNaN(arr[yn + xn[X]])) { out[Y*W+X] = NaN; continue; }
      let v = 0;
      for (let j = 0; j < 4; j++) {
        const r = yi[j];
        v += ky[j] * (src[r+xi[X*4]]*xw[X*4] + src[r+xi[X*4+1]]*xw[X*4+1] + src[r+xi[X*4+2]]*xw[X*4+2] + src[r+xi[X*4+3]]*xw[X*4+3]);
      }
      out[Y*W+X] = v;
    }
  }
  return { arr: out, w: W, h: H };
}

// mode: 'shade' | 'elev' | 'lrm' | 'gray'.  Cells without data stay transparent.
function drawReliefView(canvas, arr, lrm, shade, w, h, mode, ranges) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  const src = mode === 'lrm' ? lrm : arr;
  const [lo, hi] = mode === 'lrm' ? ranges.lrm : ranges.elev;
  const span = hi - lo || 1;
  for (let i = 0; i < arr.length; i++) {
    const o = i * 4;
    if (isNaN(arr[i])) { img.data[o + 3] = 0; continue; }
    if (mode === 'shade') {
      const v = Math.max(0, Math.min(255, 128 + (shade[i] - 0.64) * 330));
      img.data[o] = img.data[o + 1] = img.data[o + 2] = v; img.data[o + 3] = 255; continue;
    }
    let r, g, b;
    if (mode === 'gray') { r = g = b = 205; }
    else {
      const t = Math.max(0, Math.min(1, (src[i] - lo) / span));
      const li = Math.round(t * 255) * 3;
      r = RELIEF_LUT[li]; g = RELIEF_LUT[li + 1]; b = RELIEF_LUT[li + 2];
    }
    const light = 0.3 + 0.9 * shade[i];
    img.data[o] = r * light; img.data[o + 1] = g * light; img.data[o + 2] = b * light; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function drawTerrain(canvas, arr, shade, w, h) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  let min = Infinity, max = -Infinity;
  for (const v of arr) { if (!isNaN(v)) { if (v < min) min = v; if (v > max) max = v; } }
  const range = (max - min) || 1;
  for (let i = 0; i < arr.length; i++) {
    const t = (arr[i] - min) / range;
    const [r, g, b] = elevationColor(t);
    const light = 0.35 + 0.65 * shade[i];
    img.data[i * 4] = Math.min(255, r * light);
    img.data[i * 4 + 1] = Math.min(255, g * light);
    img.data[i * 4 + 2] = Math.min(255, b * light);
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return { min, max };
}

function drawDiverging(canvas, arr, w, h) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
  const std = Math.sqrt(arr.reduce((a, b) => a + (b - mean) ** 2, 0) / arr.length) || 1;
  const lim = std * 3;
  for (let i = 0; i < arr.length; i++) {
    const t = Math.max(-1, Math.min(1, arr[i] / lim));
    let r, g, b;
    if (t < 0) { r = 30 + (1 + t) * 80; g = 60 + (1 + t) * 80; b = 160; }
    else { r = 200; g = 90 - t * 60; b = 40 - t * 20; }
    img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function drawAnomalies(canvas, terrainCanvas, lrmArr, w, h, zThresh) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(terrainCanvas, 0, 0);
  const mean = lrmArr.reduce((a, b) => a + b, 0) / lrmArr.length;
  const std = Math.sqrt(lrmArr.reduce((a, b) => a + (b - mean) ** 2, 0) / lrmArr.length) || 1;
  let count = 0;
  const points = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const z = (lrmArr[i] - mean) / std;
      if (Math.abs(z) > zThresh) { points.push([x, y]); count++; }
    }
  }
  ctx.fillStyle = 'rgba(230,40,40,0.85)';
  for (const [x, y] of points) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(1.4, w / 220), 0, Math.PI * 2);
    ctx.fill();
  }
  return count;
}

function legendBar(el, stops) {
  el.style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';
}

document.getElementById('scanBtn').addEventListener('click', async () => {
  const t = I18N[currentLang];
  const apiKey = apikeyInput.value.trim();
  if (!apiKey) { setStatus(t.noApikey); apikeyInput.focus(); return; }
  if (!picked) { setStatus(t.noPoint); return; }
  localStorage.setItem(KEY_STORAGE, apiKey);

  const radiusKm = parseFloat(radiusEl.value);
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  document.getElementById('results').innerHTML = '';

  try {
    setStatus(t.downloading);
    const bbox = bboxFromCenter(picked.lat, picked.lng, radiusKm);
    let dem = null, usedHi = false;
    if (inUSCoverage(picked.lat, picked.lng)) {
      try {
        const hb = await fetchHiRes(bbox, (label) => setStatus(t.downloading + '\n(USGS 3DEP – ' + label + ')'));
        setStatus(t.processing);
        const d = await loadDem(hb);
        if (d.validFrac < 0.5) throw new Error('mostly no-data');
        dem = d; usedHi = true;
        setStatus(t.hiOk);
      } catch (e) {
        setStatus(t.hiFail);
      }
    }
    if (!dem) {
      const buffer = await fetchDem(bbox, apiKey, (label) => setStatus(t.downloading + '\n(' + label + ')'), demTypeEl.value);
      setStatus(t.processing);
      dem = await loadDem(buffer);
    }
    const { arr, width, height } = dem;
    const bb = dem.bbox || bbox;
    const midLat = (bb.north + bb.south) / 2;
    const cellX = (bb.east - bb.west) * 111320 * Math.cos(midLat * Math.PI / 180) / width;
    const cellY = (bb.north - bb.south) * 110540 / height;
    const cellSizeM = (cellX + cellY) / 2;
    const shade = hillshadeArr(arr, width, height, cellSizeM);
    const lrm = localReliefModel(arr, width, height);

    const results = document.getElementById('results');

    // ---- satellite vs relief comparison ----
    const cardC = document.createElement('div'); cardC.className = 'mapCard';
    cardC.innerHTML =
      '<div class="cap">' + t.cmpTitle + '</div><div class="sub">' + t.cmpSub + '</div>' +
      '<div class="cmpWrap"><div class="cmpMap"></div>' +
      '<span class="cmpTag l">' + t.satTag + '</span><span class="cmpTag r">' + t.reliefTag + '</span>' +
      '<div class="cmpDivider"></div><input type="range" class="cmpRange" min="0" max="100" value="50"></div>' +
      '<div class="ctrls">' +
      '<div class="row"><label>' + t.exagLabel + '</label><input type="range" class="exag" min="1" max="10" step="0.5" value="' + (cellSizeM > 15 ? 5 : 2) + '"><span class="exagVal"></span></div>' +
      '<div class="row"><label>' + t.colorLabel + '</label><select class="cmode"><option value="shade">' + t.cShade + '</option><option value="elev">' + t.cElev + '</option><option value="lrm">' + t.cLrm + '</option><option value="gray">' + t.cGray + '</option></select>' +
      '<button type="button" class="small saveBtn">' + t.saveBtn + '</button></div>' +
      '<div class="row"><label>' + t.enhLabel + '</label><input type="range" class="enh" min="0" max="3" step="0.5" value="1"><span class="enhVal"></span></div>' +
      '<div class="row"><button type="button" class="small markBtn">' + t.markBtn + '</button></div>' +
      '<div class="sub markHint" style="display:none;padding:0 0 8px">' + t.markHint + '</div></div>' +
      '<div class="marksList"></div>' +
      '<div class="sub">' + t.satAttr + '</div>';
    results.appendChild(cardC);

    const mapDiv = cardC.querySelector('.cmpMap');
    const cmpRange = cardC.querySelector('.cmpRange');
    const divider = cardC.querySelector('.cmpDivider');
    const exagEl = cardC.querySelector('.exag');
    const exagVal = cardC.querySelector('.exagVal');
    const modeEl = cardC.querySelector('.cmode');
    const bounds = L.latLngBounds([bb.south, bb.west], [bb.north, bb.east]);

    const cmap = L.map(mapDiv, { zoomAnimation: false, attributionControl: false, maxZoom: 20 });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxNativeZoom: 18, maxZoom: 20 }).addTo(cmap);
    cmap.createPane('relief');
    const reliefPane = cmap.getPane('relief');
    reliefPane.style.zIndex = 450;
    cmap.fitBounds(bounds);

    function updateClip() {
      const pos = cmpRange.value / 100;
      const size = cmap.getSize();
      const cx = 22 + (size.x - 44) * pos;
      const nw = cmap.containerPointToLayerPoint([0, 0]);
      const se = cmap.containerPointToLayerPoint(size);
      const xl = cmap.containerPointToLayerPoint([cx, 0]).x;
      reliefPane.style.clip = 'rect(' + nw.y + 'px,' + se.x + 'px,' + se.y + 'px,' + xl + 'px)';
      divider.style.left = cx + 'px';
    }
    cmap.on('move zoom viewreset resize', updateClip);
    cmpRange.addEventListener('input', updateClip);

    // smooth the coarse DEM (30 m) so the relief looks crisp, not blocky
    const upF = Math.max(1, Math.min(8, Math.ceil(1200 / Math.max(width, height))));
    let V = { arr, w: width, h: height };
    if (upF > 1) V = upsampleBicubic(arr, width, height, upF);
    const vLrm = upF > 1 ? localReliefModel(V.arr, V.w, V.h) : lrm;
    const vCellX = cellX * width / V.w, vCellY = cellY * height / V.h;
    modeEl.value = cellSizeM > 10 ? 'shade' : 'elev';
    const reliefCanvas = document.createElement('canvas');
    const ranges = { elev: percentileRange(V.arr, 0.02, 0.98), lrm: percentileRange(vLrm, 0.02, 0.98) };
    let overlay = null, lastUrl = null, renderToken = 0;
    function renderRelief() {
      const exag = parseFloat(exagEl.value);
      exagVal.textContent = '×' + exag;
      const sh = multiHillshade(V.arr, V.w, V.h, vCellX, vCellY, exag);
      drawReliefView(reliefCanvas, V.arr, vLrm, sh, V.w, V.h, modeEl.value, ranges);
      reliefPane.style.mixBlendMode = modeEl.value === 'shade' ? 'overlay' : 'normal';
      const token = ++renderToken;
      reliefCanvas.toBlob(blob => {
        if (!blob || token !== renderToken) return;
        const url = URL.createObjectURL(blob);
        if (overlay) overlay.setUrl(url);
        else overlay = L.imageOverlay(url, bounds, { pane: 'relief', interactive: false }).addTo(cmap);
        if (lastUrl) { const old = lastUrl; setTimeout(() => URL.revokeObjectURL(old), 4000); }
        lastUrl = url;
      }, 'image/png');
    }
    exagEl.addEventListener('input', () => { exagVal.textContent = '×' + exagEl.value; });
    exagEl.addEventListener('change', renderRelief);
    modeEl.addEventListener('change', renderRelief);
    cardC.querySelector('.saveBtn').addEventListener('click', () => {
      reliefCanvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'forest-scan-relief.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }, 'image/png');
    });
    // satellite clarity: contrast/saturation boost on the imagery only
    const enhEl = cardC.querySelector('.enh'), enhVal = cardC.querySelector('.enhVal');
    function applyEnh() {
      const k = parseFloat(enhEl.value);
      enhVal.textContent = '×' + k;
      cmap.getPane('tilePane').style.filter = k > 0 ? 'contrast(' + (1 + 0.3 * k) + ') saturate(' + (1 + 0.25 * k) + ') brightness(' + (1 + 0.04 * k) + ')' : '';
    }
    enhEl.addEventListener('input', applyEnh); applyEnh();

    // marking: tap to drop a red ring (also shown on the main map)
    cmpMapRef = cmap;
    cmpMarksLayer = L.layerGroup().addTo(cmap);
    marksListEl = cardC.querySelector('.marksList');
    markMode = false;
    const markBtn = cardC.querySelector('.markBtn'), markHint = cardC.querySelector('.markHint');
    markBtn.addEventListener('click', () => {
      markMode = !markMode;
      markBtn.classList.toggle('on', markMode);
      markHint.style.display = markMode ? 'block' : 'none';
      mapDiv.style.cursor = markMode ? 'crosshair' : '';
    });
    cmap.on('click', e => { if (markMode) addMark(e.latlng.lat, e.latlng.lng); });
    renderMarks();

    renderRelief();
    setTimeout(() => { cmap.invalidateSize(); cmap.fitBounds(bounds); updateClip(); }, 60);
    updateClip();

    const card1 = document.createElement('div'); card1.className = 'mapCard';
    card1.innerHTML = '<div class="cap">' + t.map1title + '</div><div class="sub">' + t.map1sub + '</div>';
    const c1 = document.createElement('canvas'); card1.appendChild(c1);
    const legend1 = document.createElement('div'); legend1.className = 'legend'; card1.appendChild(legend1);
    results.appendChild(card1);
    const { min, max } = drawTerrain(c1, arr, shade, width, height);
    legend1.innerHTML = '<span>' + Math.round(min) + ' ' + t.meters + '</span><div class="bar"></div><span>' + Math.round(max) + ' ' + t.meters + '</span>';
    legendBar(legend1.querySelector('.bar'), ['#2e6e40', '#78a846', '#d6c464', '#b08052', '#faf8f4']);

    const card2 = document.createElement('div'); card2.className = 'mapCard';
    card2.innerHTML = '<div class="cap">' + t.map2title + '</div><div class="sub">' + t.map2sub + '</div>';
    const c2 = document.createElement('canvas'); card2.appendChild(c2);
    const legend2 = document.createElement('div'); legend2.className = 'legend'; card2.appendChild(legend2);
    results.appendChild(card2);
    drawDiverging(c2, lrm, width, height);
    legend2.innerHTML = '<span>' + t.legendLow + '</span><div class="bar"></div><span>' + t.legendHigh + '</span>';
    legendBar(legend2.querySelector('.bar'), ['#3868c8', '#8090a8', '#c85a28']);

    const card3 = document.createElement('div'); card3.className = 'mapCard';
    const c3 = document.createElement('canvas');
    const count = drawAnomalies(c3, c1, lrm, width, height, 2.5);
    card3.innerHTML = '<div class="cap">' + t.map3subPrefix + count + t.map3subSuffix + '</div><div class="sub">' + t.map3sub + '</div>';
    card3.appendChild(c3);
    results.appendChild(card3);

    const footer = document.createElement('div');
    footer.className = 'footer';
    footer.innerHTML =
      t.footerCoord + ' ' + picked.lat.toFixed(5) + ', ' + picked.lng.toFixed(5) + '<br>' +
      t.footerRadius + ' ' + radiusKm + ' ' + t.footerKm + ' &nbsp;|&nbsp; ' + t.footerPixel + ' ' + Math.round(cellSizeM) + ' ' + t.footerMeters + '<br>' +
      (usedHi ? t.srcHi : t.footerSource.replace(/Copernicus DEM 30\S*/, demTypeEl.options[demTypeEl.selectedIndex].text)) + '<br>' + (usedHi ? t.noteHi : t.footerNote);
    results.appendChild(footer);

    setStatus(count + t.doneStatus);
  } catch (err) {
    if (err.message === '__NO_DATA__') {
      setStatus(t.noData);
    } else if (navigator.onLine === false) {
      setStatus(t.networkErr);
    } else {
      setStatus(t.errStatus + '\n' + err.message + t.corsHint);
    }
  } finally {
    btn.disabled = false;
  }
});
</script>
