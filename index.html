<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>اسکن زمین</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Tahoma,sans-serif; background:#0e1512; color:#eaf3ee; }
  #map { height: 42vh; width: 100%; }
  .panel { padding: 14px 16px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  label { font-size:13px; color:#9fcbb5; min-width:66px; }
  input[type=text], input[type=number] { flex:1; padding:10px; border-radius:8px; border:1px solid #23443a; background:#132621; color:#eaf3ee; font-size:14px; min-width:0; }
  input[type=range] { flex:1; }
  button { padding:14px; border:none; border-radius:10px; background:#1d9e75; color:#fff; font-size:16px; font-weight:bold; }
  button.full { width:100%; }
  button.small { padding:10px 14px; font-size:14px; background:#23443a; }
  button:disabled { background:#3a5c50; }
  #status { font-size:13px; color:#9fcbb5; margin-top:8px; min-height:18px; white-space:pre-line; }
  .maps { display:flex; flex-direction:column; gap:4px; padding:0 16px 24px; }
  .mapCard { border:1px solid #23443a; border-radius:12px; overflow:hidden; margin-bottom:14px; background:#0b100e; }
  .mapCard canvas { width:100%; display:block; }
  .cap { font-size:14px; font-weight:bold; padding:10px 12px 4px; }
  .sub { font-size:12px; color:#9fcbb5; padding:0 12px 10px; }
  .legend { display:flex; align-items:center; gap:8px; padding:0 12px 12px; font-size:11px; color:#cfe9dc; }
  .legend .bar { flex:1; height:10px; border-radius:5px; }
  .apikeyRow { display:none; }
  .apikeyRow.show { display:flex; }
  a { color:#5dcaa5; }
  .searchRow { display:flex; gap:6px; padding:10px 16px 0; }
  .searchRow input { flex:1; }
  .footer { padding:10px 16px 28px; font-size:11px; color:#6f9483; border-top:1px solid #1c2f28; margin-top:6px; line-height:1.8; }
  .suggestions { margin:0 16px; background:#132621; border:1px solid #23443a; border-radius:8px; overflow:hidden; }
  .suggestions div { padding:10px; font-size:13px; border-bottom:1px solid #1c2f28; }
  .suggestions div:last-child { border-bottom:none; }
</style>
</head>
<body>

<div class="searchRow">
  <input type="text" id="placeSearch" placeholder="اسم منطقه یا شهر رو تایپ کنید...">
  <button class="small" id="searchBtn">جستجو</button>
</div>
<div class="suggestions" id="suggestions" style="display:none"></div>

<div id="map"></div>

<div class="panel">
  <div class="row apikeyRow" id="apikeyRow">
    <label>کلید API</label>
    <input type="text" id="apikey" placeholder="کلید رایگان OpenTopography">
  </div>
  <div class="row">
    <label>شعاع (کیلومتر)</label>
    <input type="range" id="radius" min="1" max="20" value="5">
    <span id="radiusVal">5</span>
  </div>
  <div class="row">
    <label>عرض جغرافیایی</label>
    <input type="number" id="latInput" step="0.0001" placeholder="مثلاً 36.5652">
  </div>
  <div class="row">
    <label>طول جغرافیایی</label>
    <input type="number" id="lonInput" step="0.0001" placeholder="مثلاً 53.0584">
  </div>
  <button class="full" id="scanBtn">اسکن کن</button>
  <div id="status"></div>
  <div class="cap" style="font-size:12px;font-weight:normal;color:#9fcbb5;padding-top:10px">
    کلید رایگان: <a href="https://portal.opentopography.org/myopentopo" target="_blank">portal.opentopography.org/myopentopo</a>
  </div>
</div>

<div class="maps" id="results"></div>

<script>
const map = L.map('map').setView([32.4, 53.7], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '' }).addTo(map);
let marker = null;
let picked = null;

const latInput = document.getElementById('latInput');
const lonInput = document.getElementById('lonInput');

function setPicked(lat, lon, panTo) {
  picked = L.latLng(lat, lon);
  if (marker) marker.setLatLng(picked); else marker = L.marker(picked).addTo(map);
  latInput.value = lat.toFixed(5);
  lonInput.value = lon.toFixed(5);
  if (panTo) map.setView(picked, 11);
}

map.on('click', e => setPicked(e.latlng.lat, e.latlng.lng, false));

function syncFromInputs() {
  const la = parseFloat(latInput.value), lo = parseFloat(lonInput.value);
  if (!isNaN(la) && !isNaN(lo)) setPicked(la, lo, true);
}
latInput.addEventListener('change', syncFromInputs);
lonInput.addEventListener('change', syncFromInputs);

// ---- جستجوی مکان با اسم (Nominatim - رایگان) ----
const searchInput = document.getElementById('placeSearch');
const suggestionsBox = document.getElementById('suggestions');

async function doSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  suggestionsBox.innerHTML = '<div>در حال جستجو...</div>';
  suggestionsBox.style.display = 'block';
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=fa&q=' + encodeURIComponent(q);
    const res = await fetch(url);
    const list = await res.json();
    if (!list.length) { suggestionsBox.innerHTML = '<div>چیزی پیدا نشد.</div>'; return; }
    suggestionsBox.innerHTML = '';
    list.forEach(item => {
      const div = document.createElement('div');
      div.textContent = item.display_name;
      div.addEventListener('click', () => {
        setPicked(parseFloat(item.lat), parseFloat(item.lon), true);
        suggestionsBox.style.display = 'none';
        searchInput.value = item.display_name;
      });
      suggestionsBox.appendChild(div);
    });
  } catch (e) {
    suggestionsBox.innerHTML = '<div>خطا در جستجو.</div>';
  }
}
document.getElementById('searchBtn').addEventListener('click', doSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

const radiusEl = document.getElementById('radius');
radiusEl.addEventListener('input', () => document.getElementById('radiusVal').textContent = radiusEl.value);

const KEY_STORAGE = 'forestscan_apikey';
const apikeyRow = document.getElementById('apikeyRow');
const apikeyInput = document.getElementById('apikey');
const savedKey = localStorage.getItem(KEY_STORAGE);
if (savedKey) { apikeyInput.value = savedKey; } else { apikeyRow.classList.add('show'); }

function setStatus(t) { document.getElementById('status').textContent = t; }

function bboxFromCenter(lat, lon, radiusKm) {
  const dlat = radiusKm / 111.0;
  const dlon = radiusKm / (111.0 * Math.cos(lat * Math.PI / 180));
  return { south: lat - dlat, north: lat + dlat, west: lon - dlon, east: lon + dlon };
}

async function fetchDem(bbox, apiKey) {
  const url = new URL('https://portal.opentopography.org/API/globaldem');
  url.searchParams.set('demtype', 'COP30');
  url.searchParams.set('south', bbox.south);
  url.searchParams.set('north', bbox.north);
  url.searchParams.set('west', bbox.west);
  url.searchParams.set('east', bbox.east);
  url.searchParams.set('outputFormat', 'GTiff');
  url.searchParams.set('API_Key', apiKey);
  const res = await fetch(url.toString());
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('دانلود ناموفق (کد ' + res.status + '): ' + txt.slice(0, 150));
  }
  return await res.arrayBuffer();
}

async function loadDem(buffer) {
  const tiff = await GeoTIFF.fromArrayBuffer(buffer);
  const image = await tiff.getImage();
  const width = image.getWidth();
  const height = image.getHeight();
  const rasters = await image.readRasters();
  const data = rasters[0];
  const arr = new Float64Array(width * height);
  for (let i = 0; i < arr.length; i++) {
    let v = data[i];
    if (v < -1000 || v > 9000) v = NaN;
    arr[i] = v;
  }
  return { arr, width, height };
}

function boxBlur(arr, w, h, radius) {
  const out = new Float64Array(w * h);
  const tmp = new Float64Array(w * h);
  const mean = arr.reduce((a, b) => a + (isNaN(b) ? 0 : b), 0) / arr.length;
  const src = Float64Array.from(arr, v => isNaN(v) ? mean : v);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sum = 0, count = 0;
      for (let dx = -radius; dx <= radius; dx++) {
        const xx = x + dx;
        if (xx >= 0 && xx < w) { sum += src[y * w + xx]; count++; }
      }
      tmp[y * w + x] = sum / count;
    }
  }
  for (let x = 0; x < w; x++) {
    for (let y = 0; y < h; y++) {
      let sum = 0, count = 0;
      for (let dy = -radius; dy <= radius; dy++) {
        const yy = y + dy;
        if (yy >= 0 && yy < h) { sum += tmp[yy * w + x]; count++; }
      }
      out[y * w + x] = sum / count;
    }
  }
  return out;
}

function localReliefModel(arr, w, h) {
  const smooth = boxBlur(arr, w, h, 8);
  const lrm = new Float64Array(w * h);
  const mean = arr.reduce((a, b) => a + (isNaN(b) ? 0 : b), 0) / arr.length;
  for (let i = 0; i < arr.length; i++) {
    const v = isNaN(arr[i]) ? mean : arr[i];
    lrm[i] = v - smooth[i];
  }
  return lrm;
}

// شیب برای محاسبه سایه‌روشن (hillshade) ساده
function hillshadeArr(arr, w, h, cellSizeM) {
  const out = new Float64Array(w * h);
  const az = 315 * Math.PI / 180, alt = 45 * Math.PI / 180;
  const mean = arr.reduce((a, b) => a + (isNaN(b) ? 0 : b), 0) / arr.length;
  const g = v => isNaN(v) ? mean : v;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - 1), x1 = Math.min(w - 1, x + 1);
      const y0 = Math.max(0, y - 1), y1 = Math.min(h - 1, y + 1);
      const dzdx = (g(arr[y * w + x1]) - g(arr[y * w + x0])) / (2 * cellSizeM);
      const dzdy = (g(arr[y1 * w + x]) - g(arr[y0 * w + x])) / (2 * cellSizeM);
      const slope = Math.atan(Math.sqrt(dzdx * dzdx + dzdy * dzdy));
      let aspect = Math.atan2(dzdy, -dzdx);
      let sh = Math.cos(alt) * Math.cos(slope) + Math.sin(alt) * Math.sin(slope) * Math.cos(az - aspect);
      sh = Math.max(0, Math.min(1, sh));
      out[y * w + x] = sh;
    }
  }
  return out;
}

// رنگ هیپسومتریک (سبز پست تا سفید مرتفع) — شبیه نقشه‌های توپوگرافی حرفه‌ای
function elevationColor(t) {
  const stops = [
    [0.00, [46, 110, 64]],
    [0.30, [120, 168, 70]],
    [0.55, [214, 196, 100]],
    [0.78, [176, 128, 82]],
    [1.00, [250, 248, 244]]
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0, c0] = stops[i], [t1, c1] = stops[i + 1];
    if (t >= t0 && t <= t1) {
      const f = (t - t0) / (t1 - t0 || 1);
      return [
        c0[0] + (c1[0] - c0[0]) * f,
        c0[1] + (c1[1] - c0[1]) * f,
        c0[2] + (c1[2] - c0[2]) * f
      ];
    }
  }
  return stops[stops.length - 1][1];
}

function drawTerrain(canvas, arr, shade, w, h) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  let min = Infinity, max = -Infinity;
  for (const v of arr) { if (!isNaN(v)) { if (v < min) min = v; if (v > max) max = v; } }
  const range = (max - min) || 1;
  for (let i = 0; i < arr.length; i++) {
    const t = (arr[i] - min) / range;
    const [r, g, b] = elevationColor(t);
    const light = 0.35 + 0.65 * shade[i];
    img.data[i * 4] = Math.min(255, r * light);
    img.data[i * 4 + 1] = Math.min(255, g * light);
    img.data[i * 4 + 2] = Math.min(255, b * light);
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return { min, max };
}

function drawDiverging(canvas, arr, w, h) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(w, h);
  const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
  const std = Math.sqrt(arr.reduce((a, b) => a + (b - mean) ** 2, 0) / arr.length) || 1;
  const lim = std * 3;
  for (let i = 0; i < arr.length; i++) {
    const t = Math.max(-1, Math.min(1, arr[i] / lim));
    let r, g, b;
    if (t < 0) { r = 30 + (1 + t) * 80; g = 60 + (1 + t) * 80; b = 160; }
    else { r = 200; g = 90 - t * 60; b = 40 - t * 20; }
    img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return { lim };
}

function drawAnomalies(canvas, terrainCanvas, lrmArr, w, h, zThresh) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(terrainCanvas, 0, 0);
  const mean = lrmArr.reduce((a, b) => a + b, 0) / lrmArr.length;
  const std = Math.sqrt(lrmArr.reduce((a, b) => a + (b - mean) ** 2, 0) / lrmArr.length) || 1;
  let count = 0;
  const points = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const z = (lrmArr[i] - mean) / std;
      if (Math.abs(z) > zThresh) { points.push([x, y]); count++; }
    }
  }
  ctx.fillStyle = 'rgba(230,40,40,0.85)';
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 0.6;
  for (const [x, y] of points) {
    ctx.beginPath();
    ctx.arc(x, y, Math.max(1.4, w / 220), 0, Math.PI * 2);
    ctx.fill();
  }
  return count;
}

function legendBar(el, stops) {
  el.style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';
}

document.getElementById('scanBtn').addEventListener('click', async () => {
  const apiKey = apikeyInput.value.trim();
  if (!apiKey) { setStatus('کلید API رو وارد کنید.'); apikeyRow.classList.add('show'); return; }
  if (!picked) { setStatus('اول یه نقطه رو انتخاب کنید (نقشه، جستجو یا مختصات دستی).'); return; }
  localStorage.setItem(KEY_STORAGE, apiKey);
  apikeyRow.classList.remove('show');

  const radiusKm = parseFloat(radiusEl.value);
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  document.getElementById('results').innerHTML = '';

  try {
    setStatus('در حال دانلود مدل ارتفاعی...');
    const bbox = bboxFromCenter(picked.lat, picked.lng, radiusKm);
    const buffer = await fetchDem(bbox, apiKey);

    setStatus('در حال پردازش...');
    const { arr, width, height } = await loadDem(buffer);
    const cellSizeM = (radiusKm * 2 * 1000) / width;
    const shade = hillshadeArr(arr, width, height, cellSizeM);
    const lrm = localReliefModel(arr, width, height);

    const results = document.getElementById('results');

    // ۱. نقشه رنگی زمین
    const card1 = document.createElement('div'); card1.className = 'mapCard';
    card1.innerHTML = '<div class="cap">۱. مدل رنگی زمین</div><div class="sub">سبز = پست‌تر، قهوه‌ای/سفید = مرتفع‌تر — سایه‌روشن برای حس عمق</div>';
    const c1 = document.createElement('canvas'); card1.appendChild(c1);
    const legend1 = document.createElement('div'); legend1.className = 'legend'; card1.appendChild(legend1);
    results.appendChild(card1);
    const { min, max } = drawTerrain(c1, arr, shade, width, height);
    legend1.innerHTML = '<span>' + Math.round(min) + ' متر</span><div class="bar"></div><span>' + Math.round(max) + ' متر</span>';
    legendBar(legend1.querySelector('.bar'), ['#2e6e40', '#78a846', '#d6c464', '#b08052', '#faf8f4']);

    // ۲. برجستگی محلی
    const card2 = document.createElement('div'); card2.className = 'mapCard';
    card2.innerHTML = '<div class="cap">۲. برجستگی محلی</div><div class="sub">آبی = فرورفتگی نسبت به اطراف، قرمز = برجستگی نسبت به اطراف</div>';
    const c2 = document.createElement('canvas'); card2.appendChild(c2);
    const legend2 = document.createElement('div'); legend2.className = 'legend'; card2.appendChild(legend2);
    results.appendChild(card2);
    drawDiverging(c2, lrm, width, height);
    legend2.innerHTML = '<span>فرورفتگی</span><div class="bar"></div><span>برجستگی</span>';
    legendBar(legend2.querySelector('.bar'), ['#3868c8', '#8090a8', '#c85a28']);

    // ۳. ناهنجاری‌ها روی زمینه رنگی
    const card3 = document.createElement('div'); card3.className = 'mapCard';
    const c3 = document.createElement('canvas');
    const count = drawAnomalies(c3, c1, lrm, width, height, 2.5);
    card3.innerHTML = '<div class="cap">۳. نقاط ناهنجاری (' + count + ' مورد)</div><div class="sub">دایره قرمز = انحراف غیرعادی از سطح اطراف — کاندید سازه/تغییر شکل زمین</div>';
    card3.appendChild(c3);
    results.appendChild(card3);

    const footer = document.createElement('div');
    footer.className = 'footer';
    footer.innerHTML =
      'مختصات مرکز: ' + picked.lat.toFixed(5) + ', ' + picked.lng.toFixed(5) + '<br>' +
      'شعاع: ' + radiusKm + ' کیلومتر &nbsp;|&nbsp; اندازه هر پیکسل: تقریباً ' + Math.round(cellSizeM) + ' متر<br>' +
      'منبع داده: Copernicus DEM 30m (رایگان، OpenTopography)<br>' +
      'توجه: دقت مکانی ۳۰ متر — برای الگوهای بزرگ (تپه، تغییر شکل زمین)، نه اشیای کوچک مثل حفره یا فلز.';
    results.appendChild(footer);

    setStatus(count + ' نقطه ناهنجاری شناسایی شد.');
  } catch (err) {
    setStatus('خطا: ' + err.message + '\nاگه پیام مربوط به CORS بود، بگید تا یه پروکسی (Cloudflare Worker) بسازم.');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
